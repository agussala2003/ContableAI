<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <base href="/">

  <title>ContableAI - Gestión Inteligente</title>
  <meta name="description" content="ContableAI es la plataforma definitiva para automatizar la conciliación bancaria, gestionar asientos contables y clasificar movimientos financieros con inteligencia artificial.">
  <meta name="theme-color" content="#4f46e5">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180x180.png">

  <meta property="og:title" content="ContableAI - Gestión Inteligente">
  <meta property="og:description" content="Automatiza tu conciliación bancaria y gestión contable.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="og-image.png">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'light') return;
      document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body>
  <app-root>
    <!-- Loader de bootstrap: visible hasta que Angular renderiza y reemplaza este contenido.
         Estilos inline a propósito: el CSS del bundle puede no estar cargado todavía. -->
    <style>
      .cai-boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #ffffff;
        color: #475569;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      html.dark .cai-boot-loader {
        background: #0f172a;
        color: #94a3b8;
      }
      .cai-boot-loader__spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: cai-boot-spin 0.8s linear infinite;
      }
      @keyframes cai-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div class="cai-boot-loader" role="status" aria-live="polite">
      <div class="cai-boot-loader__spinner" aria-hidden="true"></div>
      <span>Cargando ContableAI...</span>
    </div>
  </app-root>
</body>
</html>
