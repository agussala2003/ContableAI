<div class="relative">
  <!-- pr-11: deja lugar al ojito para que no se superponga con el texto tipeado. -->
  <input
    [attr.id]="inputId() || null"
    [type]="visible() ? 'text' : 'password'"
    [value]="value()"
    [disabled]="disabled()"
    [attr.autocomplete]="autocomplete()"
    [attr.placeholder]="placeholder()"
    (input)="onInput($event)"
    (blur)="onTouched()"
    class="w-full px-3 py-2.5 pr-11 rounded-xl text-sm bg-slate-50 dark:bg-slate-800
           border border-slate-200 dark:border-slate-700
           text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600
           focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500
           transition-all duration-150"
  />

  <button
    type="button"
    (click)="toggle()"
    [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    [attr.aria-pressed]="visible()"
    [title]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    class="absolute inset-y-0 right-0 flex items-center px-3 rounded-r-xl
           text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300
           focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/50
           transition-colors"
  >
    <lucide-icon [name]="visible() ? 'eye-off' : 'eye'" class="w-4 h-4" aria-hidden="true"></lucide-icon>
  </button>
</div>
