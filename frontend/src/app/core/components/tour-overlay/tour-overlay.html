@if (tour.isActive()) {
  <!-- Backdrop ligero -->
  <div class="fixed inset-0 z-[8990] pointer-events-none bg-black/20"></div>

  <!-- Panel flotante bottom-right -->
  <div class="fixed bottom-6 right-6 z-[8999] w-72 rounded-2xl shadow-2xl overflow-hidden
              bg-white dark:bg-slate-900
              border border-indigo-100 dark:border-indigo-800/50
              animate-fade-in">

    <!-- Barra de progreso -->
    <div class="h-1 bg-slate-100 dark:bg-slate-800">
      <div class="h-full bg-indigo-500 transition-all duration-300 ease-out"
           [style.width]="tour.pct() + '%'"></div>
    </div>

    <div class="p-5">
      <!-- Header -->
      <div class="flex items-center justify-between mb-3">
        <span class="text-[10px] font-bold tracking-widest text-indigo-500 uppercase">
          {{ tour.progress() }}
        </span>
        <button (click)="tour.stop()"
                class="p-1 rounded-md text-slate-400 hover:text-slate-600 dark:hover:text-slate-200
                       hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                title="Cerrar tour">
          <lucide-icon name="x" class="w-3.5 h-3.5"></lucide-icon>
        </button>
      </div>

      <!-- Contenido del paso -->
      <h4 class="text-sm font-semibold text-slate-900 dark:text-slate-100 mb-1.5 leading-snug">
        {{ tour.step()!.title }}
      </h4>
      <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
        {{ tour.step()!.body }}
      </p>

      <!-- Navegación -->
      <div class="flex items-center justify-between mt-4 gap-2">
        @if (!tour.isFirst()) {
          <button (click)="tour.prev()"
                  class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium
                         text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200
                         hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            <lucide-icon name="chevron-left" class="w-3.5 h-3.5"></lucide-icon>
            Anterior
          </button>
        } @else {
          <div></div>
        }

        <button (click)="next()"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold
                       text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800
                       transition-colors shadow-sm">
          @if (tour.isLast()) {
            <lucide-icon name="check" class="w-3.5 h-3.5"></lucide-icon>
            Finalizar
          } @else {
            Siguiente
            <lucide-icon name="chevron-right" class="w-3.5 h-3.5"></lucide-icon>
          }
        </button>
      </div>
    </div>
  </div>
}

@if (showDone()) {
  <!-- Confirmación final (desaparece sola) -->
  <div class="fixed bottom-6 right-6 z-[8999] w-72 rounded-2xl shadow-xl overflow-hidden
              bg-emerald-50 dark:bg-emerald-900/30
              border border-emerald-200 dark:border-emerald-700/50
              animate-fade-in p-5">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-emerald-100 dark:bg-emerald-800/50 flex items-center justify-center shrink-0">
        <lucide-icon name="check-circle-2" class="w-5 h-5 text-emerald-600 dark:text-emerald-400"></lucide-icon>
      </div>
      <div>
        <p class="text-sm font-semibold text-emerald-800 dark:text-emerald-200">¡Tour completado!</p>
        <p class="text-xs text-emerald-600 dark:text-emerald-400 mt-0.5">Ya conocés el flujo completo.</p>
      </div>
    </div>
    <button (click)="showDone.set(false)"
            class="absolute top-3 right-3 p-1 rounded text-emerald-400 hover:text-emerald-600 transition-colors">
      <lucide-icon name="x" class="w-3.5 h-3.5"></lucide-icon>
    </button>
  </div>
}
