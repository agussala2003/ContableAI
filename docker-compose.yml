services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Sin valor por defecto: `docker compose up` falla si POSTGRES_PASSWORD no está
      # definida en el archivo .env local. Nunca hardcodear credenciales acá.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria (definila en .env)}
      POSTGRES_DB: ${POSTGRES_DB:-contableai_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-contableai_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
