<div
  class="fixed inset-0 z-[60] flex items-end sm:items-center justify-center
         bg-black/60 backdrop-blur-sm p-4
         animate-[fadeIn_0.15s_ease-out_forwards]"
  role="dialog"
  aria-modal="true"
  (click)="close.emit()"
>
  <div
    class="relative w-full max-w-lg bg-white dark:bg-slate-900
           rounded-t-2xl sm:rounded-2xl
           border border-slate-200 dark:border-slate-700/70
           shadow-2xl
           animate-[slideUp_0.2s_ease-out_forwards]"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between px-6 pt-5 pb-4 border-b border-slate-100 dark:border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-amber-50 dark:bg-amber-900/30 flex items-center justify-center shrink-0">
          <lucide-icon name="alert-circle" class="w-4 h-4 text-amber-500"></lucide-icon>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-slate-800 dark:text-slate-100">{{ title() }}</h2>
          <p class="text-xs text-slate-400 dark:text-slate-500 mt-0.5">
            {{ duplicates().length }} registro{{ duplicates().length !== 1 ? 's' : '' }} ya existían en el sistema y fueron omitidos
          </p>
        </div>
      </div>
      <button
        (click)="close.emit()"
        aria-label="Cerrar"
        class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400
               hover:text-slate-600 dark:hover:text-white
               hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"
      >
        <lucide-icon name="x" class="w-4 h-4"></lucide-icon>
      </button>
    </div>

    <!-- List -->
    <div class="overflow-y-auto max-h-72 px-4 py-3 space-y-1.5">
      @for (dup of duplicates(); track $index) {
        <div class="flex items-center justify-between gap-4 px-3 py-2.5 rounded-lg
                    bg-slate-50 dark:bg-slate-800/50">
          <div class="flex items-center gap-3 min-w-0">
            <span class="text-[11px] tabular-nums text-slate-400 dark:text-slate-500 shrink-0 font-mono">
              {{ dup.date | date:'dd/MM/yy':'UTC' }}
            </span>
            <span class="text-sm text-slate-700 dark:text-slate-300 truncate">{{ dup.description }}</span>
          </div>
          <span class="text-sm font-medium tabular-nums shrink-0 text-slate-600 dark:text-slate-300">
            {{ dup.amount | number:'1.2-2' }}
          </span>
        </div>
      }
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-slate-100 dark:border-slate-800 flex justify-end">
      <button
        (click)="close.emit()"
        class="px-5 py-2 text-sm font-medium rounded-lg
               bg-slate-900 dark:bg-white
               text-white dark:text-slate-900
               hover:bg-slate-700 dark:hover:bg-slate-100
               transition-colors"
      >
        Entendido
      </button>
    </div>
  </div>
</div>
