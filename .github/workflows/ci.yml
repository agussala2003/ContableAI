name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore ./ContableAI.slnx
        working-directory: backend

      - name: Build
        run: dotnet build ./ContableAI.slnx --no-restore --configuration Release
        working-directory: backend

      # La CI falla si algún test no pasa (o si el proyecto de tests no compila).
      # Los tests que dependen de PDFs reales (no versionados) se reportan como "Skipped",
      # nunca como "Passed" en verde: ver backend/tests/TestData/README.md.
      - name: Test
        run: dotnet test ./ContableAI.slnx --no-build --configuration Release --verbosity normal
        working-directory: backend

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      # ng test → runner Vitest sobre jsdom (Node, headless). --no-watch fuerza una
      # única corrida y salida con código de error si algún spec falla.
      - name: Test
        run: npm test -- --no-watch
        working-directory: frontend
